# Nginx configuration for Blue-Green deployment
events {
    worker_connections 1024;
}

http {
    upstream backend {
        # Default to blue, switch to green during deployment
        server blue:3001 weight=100;
        server green:3002 weight=0;
        
        # Health check
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint for load balancer
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Static files
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Blue-Green control endpoint (protected)
        location /deployment/switch {
            allow 127.0.0.1;
            deny all;
            
            content_by_lua_block {
                local target = ngx.var.arg_target
                if target == "green" then
                    -- Switch to green
                    ngx.shared.deployment:set("active", "green")
                    ngx.say("Switched to green")
                elseif target == "blue" then
                    -- Switch to blue
                    ngx.shared.deployment:set("active", "blue")
                    ngx.say("Switched to blue")
                else
                    ngx.status = 400
                    ngx.say("Invalid target")
                end
            }
        }
    }
}