# Security Scanning Workflow
name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan every Monday at 3 AM
    - cron: '0 3 * * 1'

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run npm audit
        run: |
          npm audit --production
          npm audit --audit-level=moderate
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      
      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: snyk.sarif
  
  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:${{matrix.language}}"
  
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
  
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build Docker image
        run: docker build -t sportsdata-ai:scan .
      
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sportsdata-ai:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Grype scanner
        uses: anchore/scan-action@v3
        with:
          image: sportsdata-ai:scan
          fail-build: true
          severity-cutoff: high
  
  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      
      - name: Install ESLint security plugin
        run: |
          npm install --save-dev eslint-plugin-security
          
          # Add security rules to .eslintrc.js
          echo 'module.exports.plugins = [...(module.exports.plugins || []), "security"];' >> .eslintrc.js
          echo 'module.exports.extends = [...(module.exports.extends || []), "plugin:security/recommended"];' >> .eslintrc.js
      
      - name: Run ESLint with security rules
        run: npx eslint . --ext .js --config .eslintrc.js
      
      - name: Run NodeJsScan
        uses: ajinabraham/njsscan-action@master
        with:
          args: '.'
  
  compliance-check:
    name: Security Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Check for security headers
        run: |
          # Check if security headers are implemented
          grep -r "helmet" . || echo "Warning: Helmet not found"
          grep -r "X-Frame-Options" . || echo "Warning: X-Frame-Options not set"
          grep -r "X-Content-Type-Options" . || echo "Warning: X-Content-Type-Options not set"
          grep -r "X-XSS-Protection" . || echo "Warning: X-XSS-Protection not set"
      
      - name: Check for sensitive data
        run: |
          # Check for hardcoded secrets
          grep -rEi "(password|secret|key|token).*=.*['\"]" . --exclude-dir=node_modules --exclude-dir=.git || true
      
      - name: Generate security report
        run: |
          echo "# Security Scan Report" > security-report.md
          echo "Date: $(date)" >> security-report.md
          echo "Commit: ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          echo "## Scan Results" >> security-report.md
          echo "- Dependency scan: Complete" >> security-report.md
          echo "- Code scan: Complete" >> security-report.md
          echo "- Secret scan: Complete" >> security-report.md
          echo "- Container scan: Complete" >> security-report.md
          echo "- SAST: Complete" >> security-report.md
      
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security-report.md
          retention-days: 30