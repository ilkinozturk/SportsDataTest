<!DOCTYPE html>
<html>
<head>
    <title>Final Conceded Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { margin: 10px 0; padding: 10px; background: #f3f4f6; border-radius: 4px; }
        .success { background: #d1fae5; }
        .error { background: #fee2e2; }
        button { padding: 10px 20px; margin: 5px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Final Conceded Test</h1>
    
    <div>
        <button onclick="loadPage()">1. Load Page</button>
        <button onclick="waitAndCheck()">2. Wait & Check (3s)</button>
        <button onclick="goToGoalsTab()">3. Go to Goals Tab</button>
        <button onclick="manualFix()">4. Manual Fix</button>
    </div>
    
    <div id="status"></div>
    
    <iframe id="frame" src="/team-stats.html?teamId=836" style="width: 100%; height: 400px; border: 1px solid #ccc;"></iframe>

    <script>
        function log(msg, isError = false) {
            const status = document.getElementById('status');
            const div = document.createElement('div');
            div.className = 'status ' + (isError ? 'error' : 'success');
            div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            status.appendChild(div);
        }

        function loadPage() {
            document.getElementById('frame').src = '/team-stats.html?teamId=836';
            log('Page reloaded');
        }

        function waitAndCheck() {
            setTimeout(() => {
                const doc = document.getElementById('frame').contentDocument;
                const el = doc.getElementById('concededPerMatch');
                if (el) {
                    log('concededPerMatch value: ' + el.textContent);
                    
                    // Check all conceded elements
                    const els = ['concededPerMatchTop', 'minutesPerGoalConceded', 'concededOver05', 'cleanSheets'];
                    els.forEach(id => {
                        const e = doc.getElementById(id);
                        if (e) log(`${id}: ${e.textContent}`);
                    });
                } else {
                    log('concededPerMatch element not found', true);
                }
            }, 3000);
        }

        function goToGoalsTab() {
            const doc = document.getElementById('frame').contentDocument;
            const btn = doc.querySelector('.tab-button[data-tab="goals"]');
            if (btn) {
                btn.click();
                log('Clicked Goals tab');
                
                setTimeout(() => {
                    const el = doc.getElementById('concededPerMatch');
                    if (el) {
                        log('After tab switch - concededPerMatch: ' + el.textContent);
                    }
                }, 1000);
            } else {
                log('Goals tab button not found', true);
            }
        }

        async function manualFix() {
            try {
                const doc = document.getElementById('frame').contentDocument;
                const win = document.getElementById('frame').contentWindow;
                
                // Get fresh data
                const response = await fetch('/api/teams/data?teamId=836');
                const data = await response.json();
                
                if (data.success) {
                    const stats = data.data.statistics;
                    const value = stats.averageGoalsAgainst || stats.seasonConcededAVG_overall || 0;
                    
                    log(`API value: ${value}`);
                    
                    // Update directly
                    const el = doc.getElementById('concededPerMatch');
                    if (el) {
                        el.textContent = value.toFixed(2);
                        el.style.color = 'red'; // Make it obvious
                        log(`Manually set to: ${value.toFixed(2)}`);
                    }
                    
                    // Try modular update
                    if (win.TeamStatsGoalsDisplay?.updateConcededSection) {
                        win.TeamStatsGoalsDisplay.updateConcededSection(stats, 'overall');
                        log('Called updateConcededSection');
                    }
                }
            } catch (error) {
                log('Error: ' + error.message, true);
            }
        }
    </script>
</body>
</html>
