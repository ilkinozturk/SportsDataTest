# Prometheus configuration for SportsData.Ai monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rule files
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SportsData.Ai API
  - job_name: 'sportsdata-api'
    static_configs:
      - targets: ['sportsdata-api:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Node.js application metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['sportsdata-api:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 15s