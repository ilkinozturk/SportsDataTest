<!DOCTYPE html>
<html>
<head>
    <title>Debug setState Method</title>
</head>
<body>
    <h1>Debug setState Method</h1>
    <div id="debug"></div>

    <script>
        const debugDiv = document.getElementById('debug');
        function log(msg) {
            debugDiv.innerHTML += msg + '<br>';
            console.log(msg);
        }

        // Add timestamp to avoid cache
        const timestamp = Date.now();
        const script = document.createElement('script');
        script.src = `public/js/modules/core/state-manager.js?t=${timestamp}`;
        
        script.onload = function() {
            log('State Manager script loaded with timestamp: ' + timestamp);
            
            // Check if TeamStatsStateManager exists
            if (window.TeamStatsStateManager) {
                log('✅ TeamStatsStateManager exists');
                
                // List all methods
                const methods = Object.getOwnPropertyNames(Object.getPrototypeOf(window.TeamStatsStateManager));
                log('Available methods: ' + methods.join(', '));
                
                // Check specifically for setState
                if (typeof window.TeamStatsStateManager.setState === 'function') {
                    log('✅ setState method exists and is a function');
                    
                    // Test it
                    try {
                        window.TeamStatsStateManager.setState({ test: 'value' });
                        const state = window.TeamStatsStateManager.getState();
                        log('✅ setState test successful, test value: ' + state.test);
                    } catch (error) {
                        log('❌ setState test failed: ' + error.message);
                    }
                } else {
                    log('❌ setState method does not exist or is not a function');
                    log('Type of setState: ' + typeof window.TeamStatsStateManager.setState);
                }
                
                // Check what methods do exist
                log('Available methods on instance:');
                for (let method in window.TeamStatsStateManager) {
                    if (typeof window.TeamStatsStateManager[method] === 'function') {
                        log('  - ' + method + '()');
                    }
                }
            } else {
                log('❌ TeamStatsStateManager does not exist');
            }
        };
        
        script.onerror = function() {
            log('❌ Failed to load state manager script');
        };
        
        document.head.appendChild(script);
    </script>
</body>
</html>
