<!DOCTYPE html>
<html>
<head>
    <title>API Flow Debug - Real Data Only</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 10px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>API Flow Debug - Shanghai SIPG (836)</h1>
    
    <div class="test-section">
        <h2>1. Direct API Test</h2>
        <div id="directApiTest">Testing...</div>
    </div>
    
    <div class="test-section">
        <h2>2. Module Loading Test</h2>
        <div id="moduleTest">Testing...</div>
    </div>
    
    <div class="test-section">
        <h2>3. Modular System Flow</h2>
        <div id="modularFlowTest">Testing...</div>
    </div>
    
    <div class="test-section">
        <h2>4. Console Logs</h2>
        <div class="log" id="consoleOutput">Logs will appear here...</div>
    </div>
    
    <script>
        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        let logs = [];
        
        function captureLog(type, ...args) {
            const timestamp = new Date().toISOString().substr(11, 8);
            const logEntry = `[${timestamp}] ${type.toUpperCase()}: ${args.join(' ')}`;
            logs.push(logEntry);
            updateConsoleOutput();
        }
        
        console.log = (...args) => {
            originalLog(...args);
            captureLog('log', ...args);
        };
        
        console.error = (...args) => {
            originalError(...args);
            captureLog('error', ...args);
        };
        
        console.warn = (...args) => {
            originalWarn(...args);
            captureLog('warn', ...args);
        };
        
        function updateConsoleOutput() {
            document.getElementById('consoleOutput').innerHTML = logs.slice(-10).join('<br>');
        }
        
        async function testDirectAPI() {
            const testDiv = document.getElementById('directApiTest');
            
            try {
                console.log('🔍 Testing direct API call...');
                const response = await fetch('/api/teams/data?teamId=836');
                const data = await response.json();
                
                if (data.success && data.data) {
                    testDiv.innerHTML = `
                        <div class="success">✅ Direct API: Working</div>
                        <div class="info">Team: ${data.data.teamInfo.name}</div>
                        <div class="info">PPG: ${data.data.statistics.pointsPerGame}</div>
                        <div class="info">Goals/Match: ${data.data.statistics.goalsPerMatch}</div>
                    `;
                    console.log('✅ Direct API test passed');
                    return true;
                } else {
                    testDiv.innerHTML = `<div class="error">❌ Direct API: Invalid response</div>`;
                    console.error('❌ Direct API test failed - invalid response');
                    return false;
                }
                
            } catch (error) {
                testDiv.innerHTML = `<div class="error">❌ Direct API Error: ${error.message}</div>`;
                console.error('❌ Direct API test failed:', error);
                return false;
            }
        }
        
        function testModules() {
            const testDiv = document.getElementById('moduleTest');
            
            console.log('🔧 Testing module availability...');
            
            // Load necessary scripts
            const scripts = [
                '/public/js/modules/core/constants.js',
                '/public/js/modules/core/event-bus.js', 
                '/public/js/modules/core/state-manager.js',
                '/public/js/modules/core/api-client.js',
                '/public/js/modules/core/team-service.js'
            ];
            
            let loadedCount = 0;
            
            scripts.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    loadedCount++;
                    console.log(`✅ Loaded: ${src}`);
                    
                    if (loadedCount === scripts.length) {
                        setTimeout(() => {
                            checkModules(testDiv);
                        }, 500);
                    }
                };
                script.onerror = () => {
                    console.error(`❌ Failed to load: ${src}`);
                };
                document.head.appendChild(script);
            });
        }
        
        function checkModules(testDiv) {
            const modules = {
                EventBus: window.TeamStatsEventBus,
                StateManager: window.TeamStatsStateManager,
                APIClient: window.TeamStatsAPIClient,
                TeamService: window.TeamStatsTeamService
            };
            
            let html = '';
            let allLoaded = true;
            
            Object.entries(modules).forEach(([name, module]) => {
                const loaded = !!module;
                allLoaded = allLoaded && loaded;
                html += `<div class="${loaded ? 'success' : 'error'}">
                    ${loaded ? '✅' : '❌'} ${name}: ${loaded ? 'Loaded' : 'Missing'}
                </div>`;
            });
            
            testDiv.innerHTML = html;
            console.log(`🔧 Modules check: ${allLoaded ? 'All loaded' : 'Some missing'}`);
            
            if (allLoaded) {
                setTimeout(() => testModularFlow(), 1000);
            }
        }
        
        async function testModularFlow() {
            const testDiv = document.getElementById('modularFlowTest');
            
            try {
                console.log('🚀 Testing modular system flow...');
                
                if (!window.TeamStatsTeamService) {
                    throw new Error('TeamService not available');
                }
                
                console.log('🔄 Calling TeamService.getTeamData(836)...');
                const teamData = await window.TeamStatsTeamService.getTeamData(836);
                
                if (teamData && teamData.teamInfo) {
                    testDiv.innerHTML = `
                        <div class="success">✅ Modular Flow: Working</div>
                        <div class="info">Data Source: Real API (no mock)</div>
                        <div class="info">Team: ${teamData.teamInfo.name}</div>
                        <div class="info">League: ${teamData.league?.name || 'N/A'}</div>
                        <div class="info">Position: ${teamData.leaguePosition?.position || 'N/A'}</div>
                    `;
                    console.log('✅ Modular system test passed - using real API data');
                } else {
                    throw new Error('Invalid team data received');
                }
                
            } catch (error) {
                testDiv.innerHTML = `<div class="error">❌ Modular Flow Error: ${error.message}</div>`;
                console.error('❌ Modular system test failed:', error);
            }
        }
        
        // Run tests
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎯 Starting API flow debug...');
            
            const apiWorking = await testDirectAPI();
            if (apiWorking) {
                testModules();
            } else {
                console.error('❌ Direct API failed, skipping modular tests');
            }
        });
    </script>
</body>
</html>
